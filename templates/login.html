<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Student Support AI</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <div class="auth-page">

        <div class="auth-card">

            <div class="auth-logo">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.26 10.147a60.436 60.436 0 00-.491 6.347A48.627 48.627 0 0112 20.904a48.627 48.627 0 018.232-4.41 60.46 60.46 0 00-.491-6.347m-15.482 0a50.57 50.57 0 00-2.658-.813A59.905 59.905 0 0112 3.493a59.902 59.902 0 0110.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.697 50.697 0 0112 13.489a50.702 50.702 0 017.74-3.342M6.75 15a.75.75 0 100-1.5.75.75 0 000 1.5zm0 0v-3.675A55.378 55.378 0 0112 8.443m-7.007 11.55A5.981 5.981 0 006.75 15.75v-1.5"/></svg>
                Student Support <span>AI</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Login to your student account
            </p>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages(
                with_categories=true
            ) %}

                {% if messages %}

                    {% for category, message in messages %}

                        <div class="alert {{ category }}">
                            {{ message }}
                        </div>

                    {% endfor %}

                {% endif %}

            {% endwith %}


            <!-- Login Form -->

            <form
                method="POST"
                action="{{ url_for('login') }}"
            >

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        value="{{ email | default('', true) }}"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrap">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="pw-toggle"
                            onclick="togglePassword('password', this)"
                            aria-label="Show password"
                        >
                            <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true" style="display: none;"><path d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                        </button>

                    </div>

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <p class="auth-links">
                <a href="{{ url_for('forgot_password') }}">
                    Forgot password?
                </a>
            </p>


            <p class="auth-footer">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Create Account
                </a>

            </p>

        </div>

    </div>

<script src="{{ url_for('static', filename='js/main.js') }}"></script>

</body>

</html>
